[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-log-search"
version = "0.1.0"
description = "Local and SSH log search CLI and Textual workbench"
requires-python = ">=3.10"
dependencies = ["rich>=14.3,<15"]

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
log-search = "log_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
